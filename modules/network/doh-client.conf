# Listen address for local queries
listen = [
    "127.0.0.1:53",
    "[::1]:53",
]

[upstream]
# upstream selector
upstream_selector = "random"

# Comment out default Google/Cloudflare upstreams and add Quad9:
[[upstream.upstream_ietf]]
    url = "https://dns.quad9.net/dns-query"
    weight = 50

[others]
# Bootstrap DNS servers used to resolve the hostname in the DoH URL
bootstrap = [
    "9.9.9.9:53",
    "149.112.112.112:53",
    "[2620:fe::fe]:53",
    "[2620:fe::9]:53",
]
